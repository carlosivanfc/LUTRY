<style>
/* FC77 · negro, hueso y una rendija de luz */
:root{
  --negro:#000;--carbon:#161616;--humo:#2A2A2A;--ceniza:#8A8780;--hueso:#EDE8DF;--sodio:#FFAE1A;--err:#E5735F;
  --display:"Archivo","Archivo Variable","Arial Black",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:"Newsreader","Newsreader Variable",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--negro)}
body{margin:0;background:var(--negro);color:var(--hueso);font:400 14px/1.6 var(--mono);font-variant-numeric:lining-nums;
  padding:max(20px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 36px max(18px,env(safe-area-inset-left,0px))}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:26px}
svg{display:block}
button{font:inherit;color:inherit}

.c{font:500 12px/1.35 var(--display);font-stretch:72%;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.mut{color:var(--ceniza)}

/* cabecera */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--humo)}
.sig{display:inline-flex;align-items:baseline;gap:9px;color:var(--hueso)}
.sig i{font:300 italic 21px/1 var(--serif);letter-spacing:.01em}
.sig svg{align-self:center;transform:translateY(1px)}
.topr{display:flex;align-items:center;gap:18px}
@media (max-width:520px){.meta{display:none}}
.lang{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;cursor:pointer}
.lang .c{color:var(--ceniza);transition:color .2s}
.lang[aria-checked=false] .es,.lang[aria-checked=true] .en{color:var(--hueso)}
.track{position:relative;width:36px;height:20px;border:1px solid var(--humo);border-radius:10px;background:var(--carbon)}
.knob{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--hueso);transition:transform .2s ease}
.lang[aria-checked=true] .knob{transform:translateX(16px)}
.lang:hover .track{border-color:var(--ceniza)}

/* título */
.hero{display:grid;gap:10px}
h1{margin:0;font:800 clamp(32px,5vw,56px)/.95 var(--display);font-stretch:125%;text-transform:uppercase;letter-spacing:-.015em;display:flex;align-items:center;gap:.22em}
.mark{width:.92em;height:.92em;flex:none;cursor:grab;touch-action:none}
.mark:active{cursor:grabbing}
@property --h{syntax:'<number>';inherits:true;initial-value:25}
.try{--h:25;animation:drift 14s linear infinite}
.try span:nth-child(1){color:#F2A28F;color:oklch(.8 .12 var(--h))}
.try span:nth-child(2){color:#8FD3A0;color:oklch(.8 .12 calc(var(--h) + 120))}
.try span:nth-child(3){color:#9DB4F5;color:oklch(.8 .12 calc(var(--h) + 240))}
@keyframes drift{from{--h:25}to{--h:385}}
.lede{margin:2px 0 0;font:400 14px/1.5 var(--mono);color:var(--ceniza);max-width:56ch}

/* banco */
.bench{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.bench{grid-template-columns:1fr}.controls{order:2}}
.controls{display:grid;gap:14px;min-width:0}
.tray{position:relative;border:1px dashed var(--humo);padding:16px;display:grid;gap:6px;cursor:pointer;background:var(--carbon);transition:border-color .15s}
.tray:hover,.tray.drag,.tray:focus-within{border-color:var(--hueso)}
.tray.loaded{border-style:solid}
.tray-title{font:700 14px/1.15 var(--display);font-stretch:125%;text-transform:uppercase}
.tray-file{font-size:13px;color:var(--ceniza);overflow-wrap:anywhere;min-height:1.4em}
.tray input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.lib{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:300px;overflow:auto}
.lib:empty{display:none}
.lib li{display:flex;align-items:stretch;border:1px solid var(--humo);background:var(--negro)}
.lib li.on{border-color:var(--hueso)}
.lib .pick{flex:1;display:flex;gap:10px;align-items:center;padding:6px;background:none;border:0;cursor:pointer;text-align:left;min-width:0}
.lib img{width:64px;height:42px;object-fit:cover;display:block;background:var(--carbon);flex:none}
.lib .nm{display:grid;min-width:0}
.lib .nm b{font:600 14px/1.25 var(--display);font-stretch:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .rm{background:none;border:0;border-left:1px solid var(--humo);color:var(--ceniza);width:36px;cursor:pointer;font:500 18px/1 var(--display)}
.lib .rm:hover{color:var(--hueso)}

.panel{background:var(--carbon);border:1px solid var(--humo)}
.knob-row{display:grid;gap:6px;padding:12px 16px;border-top:1px solid var(--humo)}
.knob-row:first-child{border-top:0}
.knob-row label,.knob-row .lbl{display:flex;justify-content:space-between;align-items:baseline}
.knob-row output{color:var(--hueso)}
input[type=range]{width:100%;accent-color:var(--hueso);margin:2px 0}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 6px;border:1px solid var(--humo);background:transparent;color:var(--ceniza);cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--hueso);color:var(--hueso)}
.link{background:none;border:0;padding:0;color:var(--ceniza);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--hueso)}

.btn{width:100%;padding:12px 14px;border:1px solid var(--humo);background:transparent;color:var(--hueso);cursor:pointer;
  font:700 13px/1.1 var(--display);font-stretch:110%;text-transform:uppercase;letter-spacing:.04em;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.btn.solid{background:var(--hueso);color:var(--negro);border-color:var(--hueso)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn small{font:500 11px/1 var(--display);font-stretch:72%;letter-spacing:.06em;opacity:.75}
.exports{display:grid;gap:6px}
button:focus-visible,.tray:focus-within{outline:2px solid var(--hueso);outline-offset:2px}

.msg{font-size:13px;color:var(--ceniza);min-height:1.5em}
.msg.err{color:var(--err)}
.hint{margin:0;font-size:13px;color:var(--ceniza)}

.table{background:#050505;border:1px solid var(--humo);padding:14px;display:grid;gap:12px;min-width:0}
.tabs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs .seg{width:200px}
.labels{display:flex;justify-content:space-between;gap:12px;min-height:1.4em}
.labels span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{position:relative;display:grid;place-items:center;min-height:320px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (max-width:860px){.stage{min-height:0}}
#cv{max-width:100%;max-height:72vh;height:auto;display:block;cursor:pointer}
.stage.split #cv{cursor:ew-resize}
.splitline{position:absolute;width:2px;background:var(--sodio);pointer-events:none;transform:translateX(-1px)}
.cubewrap{display:grid;gap:12px}
#cube{width:100%;aspect-ratio:4/3;max-height:68vh;display:block;background:#000;cursor:grab;touch-action:none}
#cube:active{cursor:grabbing}
.cubectl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;align-items:end}
.cubectl .knob-row{padding:0;border:0}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 16px;border-top:1px solid var(--humo);padding-top:12px}
.info div{display:grid;gap:2px;min-width:0}
.info b{font:600 15px/1.3 var(--display);font-stretch:90%;overflow-wrap:anywhere}

footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--humo);padding-top:14px}
a.xlink{color:inherit;text-transform:none;letter-spacing:.02em;text-decoration:none;border-bottom:1px solid var(--humo);transition:color .15s,border-color .15s}
a.xlink:hover,a.xlink:focus-visible{color:var(--hueso);border-color:var(--hueso)}
kbd{font:inherit;border:1px solid var(--humo);padding:0 4px}
@media (hover:none){.keys{display:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.try{animation:none}}

/* ---------- imagen de ejemplo ---------- */
function sample(){
  const w=1200,h=800,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  let r=7;const rnd=()=>(r=(r*16807)%2147483647)/2147483647;
  let gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#cfe3ef');gr.addColorStop(1,'#f4efe2');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='#4f8f3c';for(let i=0;i<60;i++){g.globalAlpha=.5;g.beginPath();g.arc(300+rnd()*600,80+rnd()*350,30+rnd()*60,0,7);g.fill()}
  g.globalAlpha=1;g.fillStyle='#e9e3d3';for(const x of[280,590,900])g.fillRect(x,0,26,h);g.fillRect(280,380,646,22);
  gr=g.createLinearGradient(0,0,260,0);gr.addColorStop(0,'#6d5a4a');gr.addColorStop(1,'#a8927c');g.fillStyle=gr;g.fillRect(0,0,280,h);
  gr=g.createLinearGradient(w,0,w-280,0);gr.addColorStop(0,'#6d5a4a');gr.addColorStop(1,'#a8927c');g.fillStyle=gr;g.fillRect(w-274,0,274,h);
  g.fillStyle='#d1453b';g.fillRect(420,540,140,140);g.fillStyle='#f2c230';g.beginPath();g.arc(720,600,80,0,7);g.fill();
  g.fillStyle='#2f5fc4';g.fillRect(830,560,110,120);g.fillStyle='#e7b796';g.beginPath();g.ellipse(600,360,70,90,0,0,7);g.fill();
  g.fillStyle='#3b2a20';g.fillRect(0,690,w,110);
  for(let i=0;i<10;i++){g.fillStyle=`rgb(${i*28},${i*28},${i*28})`;g.fillRect(300+i*60,730,60,40)}
  return c;
}

/* ---------- lectura de LUTs ---------- */
function parseCube(text,name){
  let size=0,size1=0,dmin=[0,0,0],dmax=[1,1,1],title='';const vals=[];
  for(const raw of text.split(/\r?\n/)){
    const l=raw.trim();if(!l||l[0]==='#')continue;
    const p=l.split(/\s+/),k=p[0].toUpperCase();
    if(k==='TITLE'){title=l.slice(5).trim().replace(/^"|"$/g,'')}
    else if(k==='LUT_3D_SIZE')size=+p[1];
    else if(k==='LUT_1D_SIZE')size1=+p[1];
    else if(k==='DOMAIN_MIN')dmin=p.slice(1,4).map(Number);
    else if(k==='DOMAIN_MAX')dmax=p.slice(1,4).map(Number);
    else if(k==='LUT_3D_INPUT_RANGE'||k==='LUT_1D_INPUT_RANGE'){dmin=[+p[1],+p[1],+p[1]];dmax=[+p[2],+p[2],+p[2]]}
    else if(/^[-+0-9.]/.test(p[0])&&p.length>=3)vals.push(+p[0],+p[1],+p[2]);
  }
  if(size){if(size<2||vals.length<size**3*3)throw Err('badData',{f:name});
    return{type:3,size,data:new Float32Array(vals.slice(0,size**3*3)),dmin,dmax,title,src:'.cube'}}
  if(size1){if(size1<2||vals.length<size1*3)throw Err('badData',{f:name});
    return{type:1,size:size1,data:new Float32Array(vals.slice(0,size1*3)),dmin,dmax,title,src:'.cube'}}
  throw Err('noSize',{f:name});
}
function loadImage(file,errKey='badImg'){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>res({im,u});im.onerror=()=>{URL.revokeObjectURL(u);rej(Err(errKey,{f:file.name}))};im.src=u})}
async function parseHald(file){
  const {im,u}=await loadImage(file);
  const W=im.naturalWidth,H=im.naturalHeight,P=W*H,N=Math.round(Math.cbrt(P));
  if(N<2||N**3!==P){URL.revokeObjectURL(u);throw Err('notHald',{f:file.name})}
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d',{willReadFrequently:true});

  for(let k=0;k<m*3;k+=3){const o=l?(l.type===3&&l.size===n?[l.data[k],l.data[k+1],l.data[k+2]]:evalLut(l,pin[k],pin[k+1],pin[k+2])):[pin[k],pin[k+1],pin[k+2]];
    pout[k]=o[0];pout[k+1]=o[1];pout[k+2]=o[2]}
  Object.assign(cube,{pin,pout,m});
}
let craf=0;const drawCubeSoon=()=>{if(!craf)craf=requestAnimationFrame(()=>{craf=0;drawCube()})};
function drawCube(){
  if(tab!=='cube'||!cube.pin)return;
  const dpr=Math.min(devicePixelRatio||1,2),rc=cc.getBoundingClientRect(),W=Math.round(rc.width*dpr),H=Math.round(rc.height*dpr);
  if(cc.width!==W||cc.height!==H){cc.width=W;cc.height=H}

  cloud(cx,W,H,{pin:cube.pin,pout:cube.pout,m:cube.m,tt:cube.t,mode:cube.mode,yaw:cube.yaw,pitch:cube.pitch,zoom:cube.zoom,
    ps:cube.ps*dpr*(cube.m>2000?1:1.6),axes:cube.axes&&{lw:dpr,fs:12*dpr}});
  if(!luts[cur]){cx.fillStyle='#8A8780';cx.font=`400 ${12*dpr}px 'IBM Plex Mono', monospace`;cx.fillText(t('identity'),16*dpr,H-16*dpr)}
}
let rot=null;
cc.addEventListener('pointerdown',e=>{cc.setPointerCapture(e.pointerId);rot={x:e.clientX,y:e.clientY}});
cc.addEventListener('pointermove',e=>{if(!rot)return;cube.yaw+=(e.clientX-rot.x)*.01;cube.pitch=Math.min(Math.max(cube.pitch+(e.clientY-rot.y)*.01,-1.5),1.5);rot={x:e.clientX,y:e.clientY};drawCubeSoon()});
cc.addEventListener('pointerup',()=>rot=null);cc.addEventListener('pointercancel',()=>rot=null);
cc.addEventListener('wheel',e=>{e.preventDefault();cube.zoom=Math.min(Math.max(cube.zoom*Math.exp(-e.deltaY*.0015),.4),3);drawCubeSoon()},{passive:false});
cc.addEventListener('dblclick',()=>{Object.assign(cube,{yaw:-.65,pitch:.42,zoom:1});drawCubeSoon()});
for(const[b,m]of[['mShape','shape'],['mMap','map']])$(b).onclick=()=>{cube.mode=m;$('mShape').setAttribute('aria-pressed',m==='shape');$('mMap').setAttribute('aria-pressed',m==='map');drawCubeSoon()};
$('morph').oninput=e=>{cube.t=e.target.value/100;$('morphOut').textContent=e.target.value+'%';drawCubeSoon()};
$('psize').oninput=e=>{cube.ps=+e.target.value;$('psizeOut').textContent=e.target.value;drawCubeSoon()};
$('axes').onclick=()=>{cube.axes=!cube.axes;$('axes').setAttribute('aria-pressed',cube.axes);$('axes').textContent=t(cube.axes?'axesOn':'axesOff');drawCubeSoon()};

addEventListener('resize',()=>{schedule();drawCubeSoon();drawMark()});
